{% extends 'base.html' %}
{% load django_bootstrap5 %}

{% block content %}
<div class="card-gallery card-gallery-sm">
    <h2 class="text-center mb-4">Регистрация</h2>
    <form method="POST" action="">
        {% csrf_token %}
        {% bootstrap_form form %}
        <button type="submit" class="btn-gallery w-100 mt-2">Зарегистрироваться</button>
    </form>
    <p class="meta-gallery text-center mt-3 mb-0">
        Уже есть аккаунт? <a href="{% url 'accounts:login' %}" class="link-gallery">Войти</a>
    </p>
</div>
{% endblock %}
