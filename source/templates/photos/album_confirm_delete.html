{% extends 'base.html' %}

{% block content %}
<div class="card-gallery card-gallery-sm">
    <h2 class="text-center mb-4">Удалить альбом «{{ object.title }}»?</h2>
    <p class="meta-gallery text-center mb-4">
        Вместе с альбомом удалятся все фотографии в нём ({{ object.photos.count }} шт.)
    </p>
    <form method="POST" action="">
        {% csrf_token %}
        <div class="d-flex gap-2 justify-content-center">
            <button type="submit" class="btn-gallery-danger">Да, удалить</button>
            <a href="{% url 'photos:album_detail' object.pk %}" class="btn-gallery-outline">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
